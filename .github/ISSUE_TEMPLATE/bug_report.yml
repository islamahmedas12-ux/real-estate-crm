name: Bug Report
description: Report a bug or unexpected behavior
title: "fix: [short description]"
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Context
        Describe what was expected vs. what actually happened.

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How to reproduce the bug (be specific)
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, browser, etc.
      value: |
        - OS:
        - Node version:
        - Package manager:
        - Backend/Frontend/Mobile:
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## Subtasks
        - [ ] Investigate root cause
        - [ ] Implement fix
        - [ ] Add tests
        - [ ] Verify fix

  - type: markdown
    attributes:
      value: |
        ## Acceptance criteria
        - [ ] Bug is fixed and does not regress