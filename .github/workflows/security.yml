name: Security Audit

on:
  pull_request:
    branches: [dev, qa, uat, prod]
  push:
    branches: [dev]
  schedule:
    # Run nightly at 2am UTC
    - cron: '0 2 * * *'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  TEST_API_URL: ${{ vars.TEST_API_URL || 'https://qa-api.realestate-crm.homes/api' }}
  TEST_AUTH_URL: ${{ vars.TEST_AUTH_URL || 'https://qa-auth.realestate-crm.homes' }}
  TEST_CLIENT_SECRET: ${{ secrets.TEST_CLIENT_SECRET }}

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npx tsx test/security-audit.test.ts
        env:
          TEST_API_URL: ${{ env.TEST_API_URL }}
          TEST_AUTH_URL: ${{ env.TEST_AUTH_URL }}
          TEST_CLIENT_SECRET: ${{ env.TEST_CLIENT_SECRET }}

      - name: Upload security audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-results
          path: |
            test/security-results/
          retention-days: 30
          overwrite: true

      - name: Report security status
        if: failure()
        run: |
          echo "❌ Security audit failed — critical findings detected"
          echo "Check the artifacts for detailed findings"
          exit 1